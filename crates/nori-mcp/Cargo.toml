[package]
name = "nori-mcp"
description = "nori as a Model Context Protocol server (stdio): every registry command is a tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nori-mcp"
path = "src/main.rs"

[dependencies]
nori-cli.workspace = true
nori-control.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
tempfile.workspace = true

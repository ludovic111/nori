name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  NORI_NO_SYSTEM_FONTS: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    # Our own machines (ludodesktop for Linux, the Mac mini for macOS) never run a fork's pull
    # request: those go to GitHub's runners.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (matrix.os == 'macos' && (vars.MAC_RUNNER || 'ludovics-mac-mini') || vars.LINUX_RUNNER || 'ludodesktop') || (matrix.os == 'macos' && 'macos-latest' || matrix.os) }}
    timeout-minutes: 120  # the ThinkPad (4 threads) builds from cold in over an hour
    strategy:
      fail-fast: false
      matrix:
        # Linux on every push; macOS (the Mac mini) only when started by hand:
        # gh workflow run CI --ref <branch>. Windows is coming soon.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-22.04", "macos"]' || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On our own runners, keep target/ between runs (incremental builds).
          clean: ${{ runner.environment == 'github-hosted' }}
      # GPUI's Linux backends (X11 + Wayland, Vulkan, fontconfig) and the keychain (D-Bus).
      - name: Linux dependencies
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libasound2-dev libdbus-1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libzstd-dev libglib2.0-dev
      - name: Own Rust install per repo on ludodesktop
        # The runners of several repos run at once; a shared ~/.rustup makes their installs collide.
        # (The Mac mini's runners already have their own RUSTUP_HOME and CARGO_HOME.)
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup-${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
